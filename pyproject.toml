[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webai-local"
version = "0.1.0"
description = "Local extensible Playwright web automation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48,<2", "typer>=0.12,<1", "rich>=13.7,<15", "python-dotenv>=1.0,<2", "requests>=2.31,<3", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
webai = "webai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
